<!doctype html><html lang="{{session.get('lang','ar')}}" dir="{{'rtl' if session.get('lang','ar')=='ar' else 'ltr'}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elmoder Store</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="login-page"><div class="loader"><img src="{{url_for('static',filename='assets/elmoder_logo.png')}}" alt="Elmoder Store"><small>Kings Of Apples</small><div class="spinner"></div></div><div class="login-card"><img class="login-logo" src="{{url_for('static',filename='assets/elmoder_logo.png')}}" alt="Elmoder Store"><h1>Elmoder Store</h1><p>Kings Of Apples</p>{% with msgs=get_flashed_messages(with_categories=true) %}{% if msgs %}<div class="login-msg">{% for c,m in msgs %}{{m}}{% endfor %}</div>{% endif %}{% endwith %}<form method="post"><label>Username</label><input name="username" autocomplete="username" required><label>Password</label><input type="password" name="password" autocomplete="current-password" required><label class="remember"><input type="checkbox"> Remember me</label><button class="primary">Login</button></form></div><script>setTimeout(()=>document.querySelector('.loader').classList.add('hide'),1400)</script></body></html>
