{% extends 'base.html' %}{% block content %}<header><div><h1>{{t('settings')}}</h1><p>Customize appearance and behavior</p></div></header><div class="settings-grid"><form class="panel" method="post"><h3>{{t('appearance')}}</h3><label>{{t('language')}}<select name="language"><option value="ar" {% if lang=='ar' %}selected{% endif %}>العربية</option><option value="en" {% if lang=='en' %}selected{% endif %}>English</option></select></label><label>Theme<select name="theme"><option value="light" {% if theme=='light' %}selected{% endif %}>{{t('light')}}</option><option value="dark" {% if theme=='dark' %}selected{% endif %}>{{t('dark')}}</option></select></label><label>Primary Color<select name="color"><option value="blue" {% if color=='blue' %}selected{% endif %}>{{t('blue')}}</option><option value="green" {% if color=='green' %}selected{% endif %}>{{t('green')}}</option><option value="orange" {% if color=='orange' %}selected{% endif %}>{{t('orange')}}</option><option value="red" {% if color=='red' %}selected{% endif %}>{{t('red')}}</option></select></label><button class="primary">{{t('save_settings')}}</button></form><div class="panel"><h3>About</h3><h2>Elmoder-Store</h2><p>Kings Of Apples</p><p>Smart Store & Device Management System</p></div></div>{% endblock %}
