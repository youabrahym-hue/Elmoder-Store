<!doctype html><html lang="{{lang}}" dir="{{'rtl' if lang=='ar' else 'ltr'}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{r.invoice_no}}</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="invoice"><h1>Elmoder-Store</h1><h3>Kings Of Apples</h3><hr><h2>{{t('invoice')}} {{r.invoice_no}}</h2><div class="invoice-grid"><p><b>{{t('date')}}:</b> {{r.date}}</p><p><b>{{t('merchant')}}:</b> {{r.merchant}}</p><p><b>{{t('device_name')}}:</b> {{r.device_name}}</p><p><b>{{t('model')}}:</b> {{r.model}}</p><p><b>{{t('imei')}}:</b> {{r.imei}}</p><p><b>{{t('sale_price')}}:</b> {{'{:,.2f}'.format(r.sale_price or 0)}}</p></div><button onclick="print()">Print</button></main></body></html>
